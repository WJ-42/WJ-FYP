<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WJ-FYP Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-raised: #21242c;
    --border: #2b2f38;
    --text: #e6e8eb;
    --muted: #8a8f98;
    /* Slightly lighter than --muted, for small interactive text
       (toggle buttons) that should read comfortably above WCAG AA's
       4.5:1 rather than sit close to the line the way --muted itself
       does on --panel (~5:1). */
    --muted-strong: #a5abb5;
    --accent: #5b8def;
    /* Darker than --accent specifically for solid fills carrying white
       text (nav active tab, primary buttons) - white-on-#5b8def is only
       3.2:1, failing WCAG AA's 4.5:1 for normal text; this pairing
       clears it (~4.7:1). --accent itself stays unchanged for borders/
       hover rings, where this contrast rule doesn't apply. */
    --accent-strong: #4570cc;

    /* Role-tier palette: distinct, same-lightness hues so tier reads by
       color AND position (CTO always highest) - never color alone. */
    --tier-3: #e2a53a;   /* CTO - authority, warm amber */
    --tier-2: #b083f0;   /* Product - strategy, violet */
    --tier-1: #5ec2e0;   /* Engineering - build, cyan */
    --tier-system: #4bd08a; /* deterministic system/sandbox output, not an agent */

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 20px;
    --space-5: 32px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.5;
  }
  header {
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }
  header h1 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  nav { display: flex; gap: var(--space-1); }
  nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  nav button:hover { color: var(--text); border-color: #3a3f4a; }
  nav button.active { background: var(--accent-strong); color: white; border-color: var(--accent-strong); }
  main { flex: 1; overflow: hidden; display: flex; }
  .view { flex: 1; overflow: auto; padding: var(--space-4); display: none; opacity: 0; }
  .view.active { display: block; opacity: 1; animation: fade-in .18s ease; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

  /* Shared role-tier chip: a colored dot + label, used in the feed,
     kanban cards, and the roles tab, so the same visual language marks
     "who/what tier said or owns this" everywhere it appears. */
  .tier-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; flex: none; }
  .tier-3 { color: var(--tier-3); } .tier-3.tier-dot, .tier-dot.tier-3 { background: var(--tier-3); }
  .tier-2 { color: var(--tier-2); } .tier-2.tier-dot, .tier-dot.tier-2 { background: var(--tier-2); }
  .tier-1 { color: var(--tier-1); } .tier-1.tier-dot, .tier-dot.tier-1 { background: var(--tier-1); }
  .tier-system { color: var(--tier-system); } .tier-system.tier-dot, .tier-dot.tier-system { background: var(--tier-system); }

  /* Chat feed */
  #feed { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-2); }
  .msg {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; letter-spacing: .02em; }
  .msg .role { font-weight: 600; display: inline-flex; align-items: center; text-transform: capitalize; }
  .msg .text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .msg[data-type="tool_call"] .text, .msg[data-type="tool_result"] .text { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }

  /* "Show N more lines" - a generic fallback for any message whose text
     turns out to be multi-line despite the plain-language prompting
     (e.g. the deterministic sandbox test-result message, which always
     is), so a wall of text never dumps into the feed unasked. */
  .text-toggle {
    background: none; border: none; color: var(--muted-strong); cursor: pointer; font-size: 12px;
    padding: 4px 0 0; display: block;
  }
  .text-rest { margin: 6px 0 0; font-size: 13px; white-space: pre-wrap; color: var(--text); font-family: inherit; }

  /* Logs toggle - reveals the raw tool_call/tool_result messages an
     agent's turn produced (correlated via Message.parent_id), hidden
     from the main feed by default per the "human chat, not code dump"
     design: the narrative message is the human-readable summary, Logs
     is where the tool-by-tool detail lives for anyone who wants it. */
  .logs-toggle {
    background: none; border: 1px solid var(--border); color: var(--muted-strong); cursor: pointer;
    font-size: 11px; padding: 3px 9px; border-radius: 10px; margin-top: 8px;
  }
  .logs-toggle:hover { color: var(--text); border-color: #3a3f4a; }
  .logs-panel { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .logs-panel[hidden] { display: none; } /* author display:flex above otherwise beats the UA [hidden] rule */
  .logs-panel .msg { box-shadow: none; padding: 8px 10px; }

  /* Kanban - horizontal overflow scrolls at the .view level; the fix
     here is making that scrollbar visible at all (a thin default
     scrollbar is nearly invisible on a dark background, so overflowed
     columns like ESCALATED/DONE read as "cut off", not "scroll for more"). */
  #view-kanban { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #view-kanban::-webkit-scrollbar { height: 10px; }
  #view-kanban::-webkit-scrollbar-track { background: transparent; }
  #view-kanban::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  #view-kanban::-webkit-scrollbar-thumb:hover { background: #3a3f4a; }
  #board { display: flex; gap: var(--space-3); height: 100%; align-items: flex-start; }
  .column { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; min-width: 190px; flex: 1; padding: var(--space-2); }
  .column h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 12px; }
  .card {
    background: var(--panel-raised); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; margin-bottom: var(--space-2); cursor: pointer; font-size: 13px;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .card .id { color: var(--muted); font-size: 11px; }
  .card .assignee { display: flex; align-items: center; font-size: 11px; color: var(--muted); margin-top: 6px; text-transform: capitalize; }
  .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-top: 6px; }
  .badge.waiting { background: #4a3a10; color: #f2b84b; }
  .badge.decided { background: #123a2a; color: #4bd08a; }

  /* Thread modal */
  #modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,11,14,.6); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s ease;
  }
  #modal-backdrop.open { display: flex; opacity: 1; }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 640px; max-height: 80vh;
    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    transform: scale(.98) translateY(4px); transition: transform .15s ease;
  }
  #modal-backdrop.open #modal { transform: none; }
  #modal header { border-bottom: 1px solid var(--border); }
  #modal-title { font-size: 14px; font-weight: 600; }
  #modal-close { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  #modal-thread { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #modal-decision { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  #modal-decision .prompt { font-size: 12px; color: var(--muted); }
  #modal-decision textarea {
    width: 100%; min-height: 56px; resize: vertical; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 13px;
  }
  #modal-decision .buttons { display: flex; gap: 8px; }
  #modal-decision button {
    background: var(--accent-strong); color: white; border: none; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  #modal-decision button.secondary { background: none; border: 1px solid var(--border); color: var(--text); }
  #modal-decision .status { font-size: 12px; color: var(--muted); }

  /* Roles */
  #roles { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-4); }
  .role-row {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 8px;
    padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .role-row .name { font-weight: 600; }
  .role-row .meta { color: var(--muted); font-size: 11px; }
  .role-row .preset-tag { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 6px; }
  .role-row button { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  #role-form { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #role-form h3 { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
  #role-form .row { display: flex; gap: 8px; }
  #role-form input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  #role-form button { align-self: flex-start; background: var(--accent-strong); color: white; border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  #role-form .error { color: #e06767; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>WJ-FYP</h1>
  <nav>
    <button id="tab-feed" class="active">Chat Feed</button>
    <button id="tab-kanban">Kanban</button>
    <button id="tab-roles">Roles</button>
  </nav>
</header>
<main>
  <section id="view-feed" class="view active"><div id="feed"></div></section>
  <section id="view-kanban" class="view"><div id="board"></div></section>
  <section id="view-roles" class="view">
    <div id="roles">
      <div id="role-list"></div>
      <form id="role-form">
        <h3>Add a custom role</h3>
        <div class="row">
          <input id="role-id" placeholder="id (e.g. reviewer)" required />
          <input id="role-name" placeholder="name (e.g. Reviewer)" required />
        </div>
        <div class="row">
          <input id="role-tier" type="number" placeholder="tier" required />
          <input id="role-model" placeholder="model" required />
          <input id="role-count" type="number" placeholder="count" value="1" />
        </div>
        <input id="role-personality" placeholder="personality (optional)" />
        <div id="role-form-error" class="error"></div>
        <button type="submit">Create role</button>
      </form>
    </div>
  </section>
</main>

<div id="modal-backdrop">
  <div id="modal">
    <header style="display:flex;align-items:center;padding:10px 14px;">
      <span id="modal-title"></span>
      <button id="modal-close">&times;</button>
    </header>
    <div id="modal-thread"></div>
    <div id="modal-decision" style="display:none;"></div>
  </div>
</div>

<script>
const STATUS_COLUMNS = ["intake", "backlog", "specd", "in_progress", "awaiting_test", "review", "done", "escalated", "halted"];

// message id -> its tool_call/tool_result detail messages (Message.parent_id
// - see claude_agent.py's turn_id). These never render as their own feed/
// thread entries; they're stashed here and surfaced only via the "Logs"
// toggle on the one narrative message they belong to, per the "human chat
// feed, not a code dump" design. Global (not per-view) since the feed and
// the ticket-thread modal both draw from the same message stream and a
// message's details only need parsing out of the raw list once.
const detailsByParentId = new Map();

// A message with a parent_id is tool activity belonging to another
// message's turn (see claude_agent.py's ClaudeAgent) - stash it rather
// than rendering it as its own entry. Safe to call messages through this
// one at a time, in order, whether that order comes from a bulk history
// fetch or a live websocket stream one at a time: the event log always
// serves oldest-first (see EventLog.get_all_messages/
// get_messages_for_ticket), and a turn's tool activity is always logged
// strictly before the narrative message that ends that turn, so by the
// time a parent is processed, all of its own details are already stashed.
function stashIfDetail(m) {
  if (!m.parent_id) return false;
  const list = detailsByParentId.get(m.parent_id) || [];
  list.push(m);
  detailsByParentId.set(m.parent_id, list);
  return true;
}

// role id -> tier, used to color-code every place a role shows up (feed,
// kanban assignee, roles tab) with the same visual language, so the
// CTO -> Product -> Engineering hierarchy reads at a glance rather than
// only being implied by text. "system" (deterministic sandbox output,
// not an agent - see cs3ip-sandbox-design memory) always gets its own
// color regardless of the role map.
let roleTierById = {};
function tierClassFor(role) {
  if (role === "system") return "tier-system";
  const tier = roleTierById[role];
  return tier ? `tier-${tier}` : "";
}
async function loadRoleTiers() {
  const roles = await fetch("/api/roles").then(r => r.json());
  roleTierById = {};
  roles.forEach(r => roleTierById[r.id] = r.tier);
}

// A message's own text is expected to be one plain-language line (see
// claude_agent.py's narrative prompting) - but the deterministic sandbox
// test-result message is always multi-line raw pytest output, and a model
// could still ignore the instruction. Either way, only the first line
// shows by default; the rest sits behind a "Show N more lines" toggle
// rather than dumping straight into the feed.
function renderExpandableText(container, text) {
  const lines = text.split("\n");
  container.textContent = lines[0];
  if (lines.length <= 1) return;
  const rest = lines.slice(1).join("\n");
  const toggle = document.createElement("button");
  toggle.className = "text-toggle";
  const collapsedLabel = `Show ${lines.length - 1} more line${lines.length === 2 ? "" : "s"}`;
  toggle.textContent = collapsedLabel;
  const restEl = document.createElement("pre");
  restEl.className = "text-rest";
  restEl.textContent = rest;
  restEl.hidden = true;
  toggle.onclick = () => {
    restEl.hidden = !restEl.hidden;
    toggle.textContent = restEl.hidden ? collapsedLabel : "Hide";
  };
  container.after(toggle, restEl);
}

// Renders one message. `depth` distinguishes a top-level feed/thread entry
// (0 - may carry a Logs toggle for its own detail messages) from a message
// rendered INSIDE a Logs panel (1 - a detail message itself, never carries
// its own toggle since detail messages don't have further detail).
function renderMessage(m, depth = 0) {
  const el = document.createElement("div");
  el.className = "msg";
  el.dataset.type = m.type;
  const tierClass = tierClassFor(m.sender.role);
  if (tierClass) el.style.borderLeftColor = `var(--${tierClass})`;
  const time = new Date(m.timestamp).toLocaleTimeString();
  el.innerHTML = `<div class="meta"><span class="role ${tierClass}"><span class="tier-dot ${tierClass}"></span>${m.sender.role}</span><span>${m.sender.instance_id}</span><span>${m.type}</span><span>${time}</span></div><div class="text"></div>`;
  renderExpandableText(el.querySelector(".text"), m.content.text);

  if (depth === 0) {
    const details = detailsByParentId.get(m.id);
    if (details && details.length) {
      const toggle = document.createElement("button");
      toggle.className = "logs-toggle";
      toggle.textContent = `Logs (${details.length})`;
      const panel = document.createElement("div");
      panel.className = "logs-panel";
      panel.hidden = true;
      details.forEach(d => panel.appendChild(renderMessage(d, 1)));
      toggle.onclick = () => { panel.hidden = !panel.hidden; };
      el.append(toggle, panel);
    }
  }
  return el;
}

const feedEl = document.getElementById("feed");
function appendToFeed(m) {
  if (stashIfDetail(m)) return;
  feedEl.appendChild(renderMessage(m));
  feedEl.scrollTop = feedEl.scrollHeight;
}

async function loadFeed() {
  const messages = await fetch("/api/messages").then(r => r.json());
  feedEl.innerHTML = "";
  messages.forEach(appendToFeed);
}

const boardEl = document.getElementById("board");
let ticketsById = {};

// Which decisions are valid from a paused ticket's status, matching
// fsm.py's requires_approval transitions exactly - if that table ever
// changes, this needs to change with it (there's no API to discover
// this dynamically, since the FSM lives entirely server-side).
const DECISION_OPTIONS = {
  review: [
    { trigger: "approved", label: "Approve" },
    { trigger: "changes_requested", label: "Request Changes", notes: true },
  ],
  escalated: [
    { trigger: "cto_override", label: "Override & Retry" },
    { trigger: "cto_cannot_resolve", label: "Halt" },
  ],
};

function renderBoard() {
  boardEl.innerHTML = "";
  const byStatus = {};
  STATUS_COLUMNS.forEach(s => byStatus[s] = []);
  Object.values(ticketsById).forEach(t => (byStatus[t.status] ||= []).push(t));

  STATUS_COLUMNS.forEach(status => {
    const col = document.createElement("div");
    col.className = "column";
    col.innerHTML = `<h3>${status.replace(/_/g, " ")}</h3>`;
    byStatus[status].forEach(t => {
      const card = document.createElement("div");
      card.className = "card";
      let badge = "";
      if (t.pending_trigger) {
        badge = t.human_decision
          ? `<div class="badge decided">decision recorded</div>`
          : `<div class="badge waiting">awaiting decision</div>`;
      }
      const tierClass = t.assignee_role ? tierClassFor(t.assignee_role) : "";
      const assignee = t.assignee_role
        ? `<div class="assignee"><span class="tier-dot ${tierClass}"></span>${t.assignee_role}</div>`
        : "";
      card.innerHTML = `<div class="id">${t.id}</div><div>${t.title}</div>${assignee}${badge}`;
      card.onclick = () => openThread(t);
      col.appendChild(card);
    });
    boardEl.appendChild(col);
  });
}

async function loadTickets() {
  const tickets = await fetch("/api/tickets").then(r => r.json());
  ticketsById = {};
  tickets.forEach(t => ticketsById[t.id] = t);
  renderBoard();
}

const modalBackdrop = document.getElementById("modal-backdrop");
const modalTitle = document.getElementById("modal-title");
const modalThread = document.getElementById("modal-thread");
const modalDecision = document.getElementById("modal-decision");
let openTicketId = null;

async function openThread(ticket) {
  openTicketId = ticket.id;
  modalTitle.textContent = `${ticket.id} — ${ticket.title}`;
  modalThread.innerHTML = "";
  const messages = await fetch(`/api/tickets/${ticket.id}/messages`).then(r => r.json());
  messages.forEach(m => {
    if (stashIfDetail(m)) return;
    modalThread.appendChild(renderMessage(m));
  });
  renderDecisionPanel(ticket);
  modalBackdrop.classList.add("open");
}

function renderDecisionPanel(ticket) {
  const options = ticket.pending_trigger ? (DECISION_OPTIONS[ticket.status] || []) : [];
  if (options.length === 0) {
    modalDecision.style.display = "none";
    modalDecision.innerHTML = "";
    return;
  }
  modalDecision.style.display = "flex";

  if (ticket.human_decision) {
    modalDecision.innerHTML = `<div class="status">Decision recorded: <strong>${ticket.human_decision}</strong>${
      ticket.decision_notes ? ` — "${ticket.decision_notes}"` : ""
    } — waiting for the orchestrator to pick it up.</div>`;
    return;
  }

  modalDecision.innerHTML = `<div class="prompt">Proposed: <strong>${ticket.pending_trigger}</strong> — choose how to respond.</div>`;
  const notesOption = options.find(o => o.notes);
  if (notesOption) {
    const textarea = document.createElement("textarea");
    textarea.id = "decision-notes";
    textarea.placeholder = `Notes for ${notesOption.label.toLowerCase()} (optional)`;
    modalDecision.appendChild(textarea);
  }
  const buttons = document.createElement("div");
  buttons.className = "buttons";
  options.forEach((option, i) => {
    const button = document.createElement("button");
    button.textContent = option.label;
    if (i > 0) button.classList.add("secondary");
    button.onclick = () => {
      const notes = option.notes ? document.getElementById("decision-notes")?.value.trim() || null : null;
      recordDecision(ticket.id, option.trigger, notes);
    };
    buttons.appendChild(button);
  });
  modalDecision.appendChild(buttons);
}

async function recordDecision(ticketId, trigger, notes) {
  const response = await fetch(`/api/tickets/${ticketId}/decision`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ trigger, notes }),
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    alert(`Couldn't record decision: ${body.detail || response.statusText}`);
    return;
  }
  const updated = await response.json();
  ticketsById[ticketId] = updated;
  renderBoard();
  if (openTicketId === ticketId) renderDecisionPanel(updated);
}

document.getElementById("modal-close").onclick = () => { modalBackdrop.classList.remove("open"); openTicketId = null; };
modalBackdrop.onclick = e => { if (e.target === modalBackdrop) { modalBackdrop.classList.remove("open"); openTicketId = null; } };

const roleListEl = document.getElementById("role-list");
let presetIds = new Set();

function renderRoles(roles) {
  presetIds = new Set(roles.filter(r => r.is_preset).map(r => r.id));
  roleListEl.innerHTML = "";
  roles.forEach(role => {
    const row = document.createElement("div");
    row.className = "role-row";
    row.style.borderLeftColor = `var(--tier-${role.tier}, var(--border))`;
    const tag = role.is_preset ? `<span class="preset-tag">preset</span>` : "";
    row.innerHTML = `
      <div>
        <div class="name"><span class="tier-dot tier-${role.tier}"></span>${role.name} <span class="meta">(${role.id})</span> ${tag}</div>
        <div class="meta">tier ${role.tier} · ${role.model} · ${role.count} instance${role.count === 1 ? "" : "s"}${
          role.personality ? ` · "${role.personality}"` : ""
        }</div>
      </div>`;
    if (!role.is_preset) {
      const del = document.createElement("button");
      del.textContent = "Delete";
      del.onclick = () => deleteRole(role.id);
      row.appendChild(del);
    }
    roleListEl.appendChild(row);
  });
}

async function loadRoles() {
  const roles = await fetch("/api/roles").then(r => r.json());
  renderRoles(roles);
  roles.forEach(r => roleTierById[r.id] = r.tier);
}

async function deleteRole(roleId) {
  const response = await fetch(`/api/roles/${roleId}`, { method: "DELETE" });
  if (!response.ok) {
    alert(`Couldn't delete role: ${response.statusText}`);
    return;
  }
  loadRoles();
}

const roleFormError = document.getElementById("role-form-error");
document.getElementById("role-form").addEventListener("submit", async e => {
  e.preventDefault();
  roleFormError.textContent = "";
  const id = document.getElementById("role-id").value.trim();
  if (presetIds.has(id)) {
    roleFormError.textContent = `"${id}" is a preset role id and can't be reused.`;
    return;
  }
  const body = {
    id,
    name: document.getElementById("role-name").value.trim(),
    tier: Number(document.getElementById("role-tier").value),
    model: document.getElementById("role-model").value.trim(),
    count: Number(document.getElementById("role-count").value) || 1,
    personality: document.getElementById("role-personality").value.trim() || null,
  };
  const response = await fetch("/api/roles", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!response.ok) {
    const errBody = await response.json().catch(() => ({}));
    roleFormError.textContent = errBody.detail || response.statusText;
    return;
  }
  e.target.reset();
  document.getElementById("role-count").value = 1;
  loadRoles();
});

function switchTab(name) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  document.getElementById(`view-${name}`).classList.add("active");
  if (name === "roles") loadRoles();
}
document.getElementById("tab-feed").onclick = () => switchTab("feed");
document.getElementById("tab-kanban").onclick = () => switchTab("kanban");
document.getElementById("tab-roles").onclick = () => switchTab("roles");

function connectWebSocket() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ev => {
    const { type, data } = JSON.parse(ev.data);
    if (type === "message") {
      // Stashed at most once here, and the boolean reused for both the
      // feed and the modal - calling stashIfDetail twice for the same
      // message (once per surface) would double-count it in its parent's
      // Logs panel.
      if (!stashIfDetail(data)) {
        feedEl.appendChild(renderMessage(data));
        feedEl.scrollTop = feedEl.scrollHeight;
        if (modalBackdrop.classList.contains("open") && data.ticket_ref && ticketsById[data.ticket_ref]) {
          modalThread.appendChild(renderMessage(data));
        }
      }
    } else if (type === "ticket_update") {
      ticketsById[data.id] = data;
      renderBoard();
      if (openTicketId === data.id) renderDecisionPanel(data);
    }
  };
  ws.onclose = () => setTimeout(connectWebSocket, 1000);
}

// Role tiers load first so the very first feed/board render already
// has tier colors, instead of an untinted flash before a re-render.
loadRoleTiers().then(() => {
  loadFeed();
  loadTickets().then(() => {
    const match = location.hash.match(/^#ticket:(.+)$/);
    if (match && ticketsById[match[1]]) {
      switchTab("kanban");
      openThread(ticketsById[match[1]]);
    }
  });
});
connectWebSocket();
if (location.hash === "#kanban") switchTab("kanban");
if (location.hash === "#roles") switchTab("roles");
</script>
