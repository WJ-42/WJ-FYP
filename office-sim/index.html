<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office — top-down simulation</title>

    <!-- Three.js is vendored locally (office-sim/vendor) so this prototype runs
         offline and stays reproducible for the write-up. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
        }
      }
    </script>

    <style>
      :root {
        --ink: #eef1ec;
        /* Soft ink and card opacity are tuned together: the card composites over
           a light 3D scene, so a dimmer grey here drops below 4.5:1 in practice. */
        --ink-soft: #c3cbc0;
        --card: rgba(18, 21, 18, 0.84);
        --line: rgba(238, 241, 236, 0.14);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #c9cfc6;
        font-family: var(--mono);
      }

      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }

      #view:active {
        cursor: grabbing;
      }

      .hud {
        position: fixed;
        z-index: 2;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(9px);
        -webkit-backdrop-filter: blur(9px);
        padding: 12px 14px;
        user-select: none;
      }

      #title {
        top: 18px;
        left: 18px;
      }

      #title h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #title p {
        margin: 6px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-soft);
        letter-spacing: 0.02em;
      }

      #title .layer {
        color: var(--ink);
      }

      #controls {
        bottom: 18px;
        left: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-size: 13px;
        color: var(--ink-soft);
        letter-spacing: 0.02em;
        max-width: min(560px, calc(100vw - 36px));
      }

      #controls span {
        white-space: nowrap;
      }

      kbd {
        font: inherit;
        color: var(--ink);
        background: rgba(238, 241, 236, 0.1);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
        margin-right: 4px;
      }

      #hint-anchors.on {
        color: #ff9d8a;
      }

      #hint-nav.on {
        color: #ff9d8a;
      }

      #hint-paths.on {
        color: #6fe0d2;
      }

      #hint-labels.off {
        color: #6f776d;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div class="hud" id="title">
      <h1>Agent Office</h1>
      <p><span class="layer">Layer 3</span> &middot; navigation and walk animation</p>
    </div>

    <div class="hud" id="controls">
      <span><kbd>drag</kbd>pan</span>
      <span><kbd>scroll</kbd>zoom</span>
      <span><kbd>right-drag</kbd>rotate</span>
      <span><kbd>R</kbd>reset view</span>
      <span id="hint-anchors"><kbd>G</kbd>station anchors</span>
      <span id="hint-labels"><kbd>L</kbd>name tags</span>
      <span id="hint-nav"><kbd>N</kbd>nav grid</span>
      <span id="hint-paths"><kbd>P</kbd>routes</span>
      <span><kbd>1</kbd>to the board</span>
      <span><kbd>0</kbd>back to desks</span>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
