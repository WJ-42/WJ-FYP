<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office — top-down simulation</title>

    <!-- Three.js is vendored locally (office-sim/vendor) so this prototype runs
         offline and stays reproducible for the write-up. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
        }
      }
    </script>

    <style>
      :root {
        --ink: #eef1ec;
        /* Soft ink and card opacity are tuned together: the card composites over
           a light 3D scene, so a dimmer grey here drops below 4.5:1 in practice. */
        --ink-soft: #c3cbc0;
        --card: rgba(18, 21, 18, 0.84);
        --line: rgba(238, 241, 236, 0.14);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #c9cfc6;
        font-family: var(--mono);
      }

      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }

      #view:active {
        cursor: grabbing;
      }

      .hud {
        position: fixed;
        z-index: 2;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(9px);
        -webkit-backdrop-filter: blur(9px);
        padding: 12px 14px;
        user-select: none;
      }

      #title {
        top: 18px;
        left: 18px;
      }

      #title h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #title p {
        margin: 6px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-soft);
        letter-spacing: 0.02em;
      }

      #title .layer {
        color: var(--ink);
      }

      #controls {
        bottom: 18px;
        left: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        font-size: 13px;
        color: var(--ink-soft);
        letter-spacing: 0.02em;
        max-width: min(560px, calc(100vw - 36px));
      }

      #controls span {
        white-space: nowrap;
      }

      kbd {
        font: inherit;
        color: var(--ink);
        background: rgba(238, 241, 236, 0.1);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
        margin-right: 4px;
      }

      #hint-anchors.on {
        color: #ff9d8a;
      }

      #hint-nav.on {
        color: #ff9d8a;
      }

      #hint-paths.on {
        color: #6fe0d2;
      }

      #hint-labels.off,
      #hint-badges.off {
        color: #6f776d;
      }

      /* --- Scenario panel ------------------------------------------------ */

      #scenarios {
        top: 18px;
        right: 18px;
        width: min(320px, calc(100vw - 36px));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #scenarios h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      #scenario-list {
        display: grid;
        gap: 4px;
      }

      #scenarios button {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: rgba(238, 241, 236, 0.06);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 9px;
        text-align: left;
        cursor: pointer;
      }

      #scenarios button:hover {
        background: rgba(238, 241, 236, 0.13);
      }

      /* Never rely on the hover tint alone to show which one is playing. */
      #scenarios button[aria-pressed='true'] {
        background: rgba(111, 224, 210, 0.18);
        border-color: rgba(111, 224, 210, 0.55);
      }

      #scenarios button:focus-visible {
        outline: 2px solid #6fe0d2;
        outline-offset: 2px;
      }

      .transport {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .transport button {
        text-align: center !important;
        padding: 6px 10px !important;
      }

      .speeds {
        display: flex;
        gap: 2px;
        margin-left: auto;
      }

      .speeds button {
        padding: 6px 7px !important;
        font-size: 12px !important;
      }

      #scenario-progress {
        height: 4px;
        border-radius: 2px;
        background: rgba(238, 241, 236, 0.13);
        overflow: hidden;
      }

      #scenario-bar {
        height: 100%;
        width: 0;
        background: #6fe0d2;
      }

      #scenario-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }

      #scenario-note {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div class="hud" id="title">
      <h1>Agent Office</h1>
      <p><span class="layer">Layer 5</span> &middot; scenario library with playback controls</p>
    </div>

    <div class="hud" id="scenarios">
      <h2>Scenarios</h2>
      <!-- Buttons are generated from the library in scenarios.js, so the panel
           cannot fall out of step with what can actually be played. -->
      <div id="scenario-list"></div>

      <div class="transport">
        <button id="btn-play" type="button">Pause</button>
        <button id="btn-restart" type="button">Restart</button>
        <span class="speeds" id="speeds" role="group" aria-label="Playback speed"></span>
      </div>

      <div id="scenario-progress">
        <div id="scenario-bar"></div>
      </div>
      <div id="scenario-meta">
        <span id="scenario-name">—</span>
        <span id="scenario-time">0:00 / 0:00</span>
      </div>

      <p id="scenario-note" aria-live="polite">Pick a scenario to play it.</p>
    </div>

    <div class="hud" id="controls">
      <span><kbd>drag</kbd>pan</span>
      <span><kbd>scroll</kbd>zoom</span>
      <span><kbd>right-drag</kbd>rotate</span>
      <span><kbd>R</kbd>reset view</span>
      <span id="hint-anchors"><kbd>G</kbd>station anchors</span>
      <span id="hint-labels"><kbd>L</kbd>name tags</span>
      <span id="hint-nav"><kbd>N</kbd>nav grid</span>
      <span id="hint-paths"><kbd>P</kbd>routes</span>
      <span id="hint-badges"><kbd>B</kbd>activity</span>
      <span><kbd>1</kbd>–<kbd>6</kbd>scenarios</span>
      <span><kbd>space</kbd>play / pause</span>
      <span><kbd>enter</kbd>restart</span>
      <span><kbd>-</kbd><kbd>=</kbd>speed</span>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
