[project]
name = "wjfyp"
version = "0.1.0"
description = "CS3IP: LLM-based multi-agent simulation of a software company"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Added as later layers need them - not installed yet, dev environment
# is intentionally parked until the Omarchy Linux setup (see
# cs3ip-fyp-overview memory).
api = ["fastapi", "uvicorn[standard]", "websockets"]
sandbox = ["docker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wjfyp"]
