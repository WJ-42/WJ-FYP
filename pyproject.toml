[project]
name = "wjfyp"
version = "0.1.0"
description = "CS3IP: LLM-based multi-agent simulation of a software company"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Added as later layers need them.
# httpx is needed for FastAPI's TestClient (used to test the dashboard
# API/websocket layer), not the running server itself.
api = ["fastapi", "uvicorn[standard]", "websockets", "httpx"]
sandbox = ["docker"]
agent = ["anthropic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wjfyp"]
