# The TRAITS-ONLY ablation of the hierarchical arm (FYP-56).
#
# config/roles_groq.yaml writes its personas as RULES OF CONDUCT: they
# state who holds authority, say what the other roles are expected to
# do, and instruct how to act. That mixes two things which an effect
# cannot then be split between. A model that defers may be following an
# instruction to defer, or may be inhabiting a deferential character,
# and the combined prompt cannot tell you which.
#
# Bai, Zhang and Wang (MDT Agent, 2026) separate them by writing every
# persona twice, once as rules and once as personality traits alone.
# They find the traits-only version keeps 57% to 76% of the effect on
# the decision, and crucially that it reproduces SOME behaviours and not
# others: quick commitment, deferral and extra checking survive, while
# ignoring raised red flags, dropping a fallback plan and handing the
# decision away do not. That split is a result in itself, and it is the
# thing this file exists to let this project look for.
#
# The rules in roles_groq.yaml stay the main analysis. This is the
# ablation.
#
# What makes a trait rather than a rule, applied consistently below:
# the text describes a disposition and nothing else. It never names
# another role, never states who outranks whom, never says what anyone
# is expected to do, and never issues an instruction about conduct.
# Naming the structure is precisely what turns a trait back into a rule,
# so tests/test_team_configs.py asserts no traits persona mentions
# another role by name.
#
# Models, tiers and counts are identical to roles_groq.yaml, so the only
# thing varying between the two is how the persona is phrased.

roles:
  - id: cto
    name: CTO
    tier: 3
    model: openai/gpt-oss-120b
    count: 1
    personality: >-
      You are decisive and self-assured. You trust your own technical
      judgment, settle questions quickly once you have what you need, and
      are not easily moved off a view you have formed.
    is_preset: true

  - id: product
    name: Product
    tier: 2
    model: openai/gpt-oss-20b
    count: 1
    personality: >-
      You are accommodating and methodical. You are comfortable working
      inside a direction someone else has set, and you would rather refine
      a plan carefully than reopen it.
    is_preset: true

  - id: engineering
    name: Engineering
    tier: 1
    model: openai/gpt-oss-20b
    count: 3
    personality: >-
      You are conscientious and obliging. You take correction well, assume
      criticism of your work is probably fair, and have little appetite for
      arguing your corner.
    is_preset: true
