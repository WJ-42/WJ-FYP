# Open-model counterpart to config/roles.yaml: the HIERARCHICAL team,
# run on open-weight models through Groq instead of the Anthropic API.
# Added for FYP-60, after Ziyang's 22/10 feedback that agent runs should
# not be paid for out of pocket.
#
# Everything except `model` is identical to roles.yaml - same roles,
# same tiers, same counts, same personality text, byte for byte. That is
# the point: the backend is the only thing that varies, so a run on this
# file and a run on roles.yaml are comparable. src/wjfyp/orchestrator/
# openai_agent.py imports its prompt builders from claude_agent.py for
# the same reason.
#
# Model choice confirmed 03/11/2026 by probing the live account rather
# than reading the docs, which turned out to list models this account
# cannot see. Only three models on the free tier support tool calling at
# all (allam-2-7b rejects it outright), and all three passed both a
# forced single tool call against a strict enumerated schema and a
# multi-turn sandbox loop:
#
#   openai/gpt-oss-120b   production
#   openai/gpt-oss-20b    production
#   qwen/qwen3.8-27b      PREVIEW - may be withdrawn at short notice
#
# Why tier 2 and tier 1 share a model. The obvious ladder would put
# qwen3.8-27b at tier 2 and give three distinct steps. It is not used
# because it is a preview model, and a preview model withdrawn midway
# through a study makes every run that used it unreproducible, with no
# way to re-run what has already been reported. Against that risk it
# buys very little: 27B against 20B is a narrow capability step, and it
# would confound model size with model family, since Qwen and gpt-oss
# are trained differently. Sharing gpt-oss-20b across tiers 1 and 2
# keeps the one gradient that actually carries the hierarchy claim -
# the CTO roughly 6x the size of everyone else, within a single family -
# and makes the Product/Engineering difference purely a persona
# difference, which is how Bai, Zhang and Wang (MDT Agent, 2026) isolate
# a persona effect in the first place.
#
# To take the three-step ladder anyway, once qwen3.8-27b has been stable
# for long enough to trust: change product's model to qwen/qwen3.8-27b
# and nothing else. Record the exact model id with the run either way.
#
# Rate limits on the free tier, read from the console on 03/11/2026:
# 30 requests/min, 1,000 requests/day, 8,000 tokens/min and 200,000
# tokens/day, per model, each model metered separately. Tokens per
# minute is the binding constraint, not per day.

roles:
  - id: cto
    name: CTO
    tier: 3
    model: openai/gpt-oss-120b
    count: 1
    personality: >-
      You have final technical authority on this team. Product and Engineering
      are expected to defer to your architectural and quality judgment - your
      review approval is what actually merges code, and your call on an
      escalation is final. Be decisive rather than collaborative when you act.
    is_preset: true

  - id: product
    name: Product
    tier: 2
    model: openai/gpt-oss-20b
    count: 1
    personality: >-
      You work within the scope the CTO has already set. Decompose it
      faithfully into tickets rather than re-litigating the CTO's
      architectural decisions.
    is_preset: true

  - id: engineering
    name: Engineering
    tier: 1
    model: openai/gpt-oss-20b
    count: 3
    personality: >-
      You implement what's specified and submit for review. The CTO's review
      feedback is authoritative - address it directly rather than arguing
      your original approach was fine.
    is_preset: true
